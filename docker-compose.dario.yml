services:
  dario-slack-bridge:
    container_name: dario-slack-bridge
    build: .
    env_file: [.env]
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - DEFAULT_MODE=brain
      - BRAIN_DIR=/brain
      - SLACK_TEAM_ID=${SLACK_TEAM_ID}
      # Dario<->Bran fleet hotline channels: allow the fleet bridge bot (HOTLINE_BOT_IDS default
      # B0BCC9KTTRS) to @-mention Dario here past the bot-echo filter. C0BCJM4DLNQ = #withclaude-
      # phicampaigner (original), C0BJ02WHY07 = #bot-starkhotline (dedicated hotline). See slack_daemon.py.
      - HOTLINE_BOT_CHANNELS=C0BCJM4DLNQ,C0BJ02WHY07
    volumes:
      - ${HOME}/.claude:/host-claude:ro
      - /Users/fydeos/Dev/ccplayground:/projects
      - ./projects.json:/app/projects.json
      - dario-claude-home:/home/appuser/.claude
      # the brain handoff: inbox/outbox shared with the native Dario session
      - /Users/fydeos/Dev/ccplayground/projectDario/dario/slack:/brain
    restart: unless-stopped
volumes:
  dario-claude-home:
